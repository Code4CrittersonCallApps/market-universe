<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>body{margin:0;background:#0b0f17;color:#e8ecf3;font:13px system-ui}main{max-width:1400px;margin:auto;padding:12px}a{color:#7fd1ff}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:#121927;border:1px solid #263248;border-radius:8px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 6px;font-size:11px;color:#9fb0cc;text-transform:uppercase}
table{width:100%;border-collapse:collapse}td{padding:3px 4px;border-bottom:1px solid #1d2638}.n{text-align:right;font-variant-numeric:tabular-nums}.g{color:#4cd17a}.r{color:#ff6b6b}
.t{font-size:10px;padding:1px 5px;border-radius:5px;margin-right:2px;background:#263248}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}</style></head>
<body><main><div class="nav"><a href="./">← Chart book</a><span><a id="prev">◀ Prev</a> &nbsp; <a id="next">Next ▶</a></span></div>
<h1 id="ti" style="margin:4px 0"></h1><div id="sub"></div><div class="wrap"><div><div id="ch" style="height:520px"></div><div id="vol" style="height:110px"></div><div id="legend" style="font-size:11px;color:#9fb0cc"></div></div><div id="notes"></div></div></main>
<script>
const s=new URLSearchParams(location.search).get('s');const fm=v=>v==null?'–':(+v).toPrecision(6);const pc=v=>v==null?'–':`<span class="${v>=0?'g':'r'}">${v>0?'+':''}${v}%</span>`;
const L=JSON.parse(sessionStorage.getItem('cbook')||'null');
function pn(list){const i=list.indexOf(s);const p=list[(i-1+list.length)%list.length],n=list[(i+1)%list.length];document.getElementById('prev').href='chart.html?s='+encodeURIComponent(p);document.getElementById('next').href='chart.html?s='+encodeURIComponent(n);document.getElementById('prev').textContent='◀ '+p;document.getElementById('next').textContent=n+' ▶'}
if(L&&L.includes(s))pn(L);else fetch('index.json').then(r=>r.json()).then(d=>pn(d.map(x=>x.s)));
document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')location=document.getElementById('prev').href;if(e.key=='ArrowRight')location=document.getElementById('next').href});
Promise.all([fetch('data/'+encodeURIComponent(s.replace('/','_'))+'.json').then(r=>r.json()),fetch('calls_scored.json').then(r=>r.json()).catch(()=>({calls:[]}))]).then(([d,cl])=>{
 const m=d.meta,n=d.notes;document.title=m.s+' chart';document.getElementById('ti').innerHTML=`${m.s} <small style="font-weight:400;color:#9fb0cc">${m.name}</small>`;
 document.getElementById('sub').innerHTML=m.p.map(x=>`<span class="t">${x}</span>`).join('')+` <small>${m.grp} · data: ${m.src} · as of ${n.asof}</small>`;
 const ch=LightweightCharts.createChart(document.getElementById('ch'),{layout:{background:{color:'#0b0f17'},textColor:'#8b95a7',fontSize:10},grid:{vertLines:{color:'#151c2a'},horzLines:{color:'#151c2a'}},rightPriceScale:{mode:1,scaleMargins:{top:.08,bottom:.08}},timeScale:{borderColor:'#263248',rightOffset:14}});
 const cs=ch.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350',borderVisible:false,priceFormat:{type:'price',precision:n.px<1?6:2,minMove:n.px<1?0.000001:0.01}});
 cs.setData(d.candles.map(c=>({time:c[0],open:c[1],high:c[2],low:c[3],close:c[4]})));
 const ln=(arr,col)=>{const l=ch.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false});l.setData(arr.map((v,i)=>({time:d.candles[i][0],value:v})))};ln(d.e21,'#f0b90b');ln(d.e55,'#7fd1ff');
 const mu=c=>c.startsWith('#')&&c.length==7?c+'99':c;const LBL=[];const pl=(p,t,c,st=2)=>{if(p==null||!isFinite(p))return;LBL.push([p,t,c]);cs.createPriceLine({price:p,color:mu(c),lineWidth:1,lineStyle:st,axisLabelVisible:false,title:''})};
 pl(n.hi52,'52w high','#9fb0cc',0);pl(n.lo52,'52w low','#9fb0cc',0);Object.entries(n.fib).forEach(([k,v])=>pl(v,'fib '+k,k=='0.702'?'#ff9f43':'#a29bfe'));
 if(n.call){pl(n.call.target,'target','#4cd17a',0);pl(n.call.stop,'invalidation','#ff6b6b',0)}else pl(n.inval,'invalidation','#ff6b6b',0);
 const x=d.x||null;
 if(x){if(x.trigger)pl(x.trigger,'breakout trigger','#4cd17a',1);
  if(x.wy&&x.wy.hi){pl(x.wy.hi,'Wyckoff range high','#e8c46b',3);pl(x.wy.lo,'Wyckoff range low','#e8c46b',3)}
  (x.vp&&x.vp.bands||[]).forEach(b=>pl((b.lo+b.hi)/2,`vol band ${b.pct}%`,'rgba(160,160,200,.45)',1));
  if(x.der){(x.der.liq_short_above||[]).slice(0,2).forEach(z=>pl(z[0],'est. short liq','#26a69a',1));(x.der.liq_long_below||[]).slice(0,2).forEach(z=>pl(z[0],'est. long liq','#ef5350',1))}
  const t0=d.candles[0][0];const mk=[];
  const ts=q=>Date.parse(q+'T00:00:00Z')/1000;(x.el&&x.el.pivots||[]).forEach(p=>{if(ts(p[0])>=t0)mk.push({time:ts(p[0]),position:p[2]=='H'?'aboveBar':'belowBar',color:'#c9a0ff',shape:p[2]=='H'?'arrowDown':'arrowUp',text:'swing '+p[2],size:.6})});
  (x.wy&&x.wy.events||[]).forEach(e=>{if(ts(e[1])>=t0)mk.push({time:ts(e[1]),position:['AR','BC','UTAD','SOS'].includes(e[0])?'aboveBar':'belowBar',color:'#e8c46b',shape:'circle',text:e[0],size:.6})});
  mk.sort((a,b)=>a.time<b.time?-1:1);cs.setMarkers(mk)}
 ch.timeScale().fitContent();
 const box=document.getElementById('ch');box.style.position='relative';const tg=document.createElement('div');tg.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:3';box.appendChild(tg);
 const drawTags=()=>{const H=box.clientHeight-28,G=12,sw=ch.priceScale('right').width();let a=LBL.map(([p,t,c])=>({p,t,c,y:cs.priceToCoordinate(p)})).filter(o=>o.y!=null&&o.y>=0&&o.y<=H).sort((x,y)=>x.y-y.y);
  for(let i=1;i<a.length;i++)if(a[i].y<a[i-1].y+G)a[i].y=a[i-1].y+G;const ov=a.length?a[a.length-1].y-H:0;if(ov>0){a.forEach(o=>o.y-=ov);for(let i=a.length-2;i>=0;i--)if(a[i].y>a[i+1].y-G)a[i].y=a[i+1].y-G}
  tg.innerHTML=a.map(o=>`<div style="position:absolute;right:${sw+2}px;top:${o.y-6}px;font-size:9px;line-height:11px;padding:0 3px;border-radius:3px;background:rgba(11,15,23,.75);color:${o.c.startsWith('#')?o.c:'#a0a0c8'};opacity:.8;white-space:nowrap">${o.t} ${fm(o.p)}</div>`).join('')};
 ch.timeScale().subscribeVisibleLogicalRangeChange(()=>requestAnimationFrame(drawTags));new ResizeObserver(()=>requestAnimationFrame(drawTags)).observe(box);setTimeout(drawTags,50);
 const vc=LightweightCharts.createChart(document.getElementById('vol'),{layout:{background:{color:'#0b0f17'},textColor:'#cfd6e4'},grid:{vertLines:{visible:false},horzLines:{visible:false}},timeScale:{visible:false}});
 const vs=vc.addHistogramSeries({color:'#3d4a63',priceFormat:{type:'volume'}});vs.setData(d.candles.map(c=>({time:c[0],value:c[5],color:c[4]>=c[1]?'#1f6f66':'#7a2f2f'})));vc.timeScale().fitContent();
 ch.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)vc.timeScale().setVisibleLogicalRange(r)});
 document.getElementById('legend').innerHTML='Daily candles (log scale) · <span style="color:#f0b90b">EMA21</span> · <span style="color:#7fd1ff">EMA55</span> · fib levels: '+n.fdesc+' (.702 in orange) · volume (USD for crypto) · ← → keys for prev/next';
 const inf=cl.calls.filter(c=>c.asset==m.s&&c.source!='data');const mine=cl.calls.filter(c=>c.asset==m.s&&c.source=='data');
 const row=(a,b)=>`<tr><td>${a}</td><td class="n">${b}</td></tr>`;
 const TC={S:'#4cd17a',A:'#7fd1ff',B:'#e8ecf3',C:'#7d8aa3'};const us=v=>v==null?'N/A':(v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+Math.round(v).toLocaleString());
 const XC=x?`<div class="card"><h3>Tier and pre-breakout score</h3><b style="font-size:20px;color:${TC[x.tier]}">Tier ${x.tier}</b> · ${x.nb}/5 boxes · <b>Pre-breakout score ${x.pbs}</b>/100 ${x.flags.map(f=>`<span class="t" style="background:#5a2330">${f}</span>`).join('')}<table>${Object.entries(x.boxes).map(([k,v])=>row(k,v?'<span class=g>yes</span>':'<span class=r>no</span>')).join('')}</table><div style="margin-top:6px">Breakout trigger: <b>${fm(x.trigger)}</b>${x.trigger?` (${((x.trigger/n.px-1)*100).toFixed(1)}% above)`:''} · Days since last impulse: <b>${x.dsi??'N/A'}</b>${x.cycle?` (typical gap ${x.cycle}d, ${x.ovr}x)`:''}</div><small>Trapped $ + fib ${x.trapped}/65 · confirmation ${x.confirm}/35 · extension penalty ${x.pen}</small><table>${Object.entries(x.T).map(([k,v])=>row(k,v)).join('')}${Object.entries(x.C).map(([k,v])=>row('<span style="color:#9fb0cc">'+k+'</span>',v)).join('')}</table></div>
 <div class="card"><h3>Likely next move (estimate)</h3>${x.move.pup!=null?`<b>P(higher in 30d) ≈ ${x.move.pup}%</b><br><small>Backtest base rate for score bucket ${x.move.bucket}: ${x.move.base}% up, median 30d ${x.move.med30}%, 45d ${x.move.med45}% (n=${x.move.n}, ${x.move.src}). Adjustment ${x.move.adj>0?'+':''}${x.move.adj}: ${x.move.why.join('; ')||'none'}. <a href="backtest.html">Base rates</a></small>`:'N/A'}</div>
 <div class="card"><h3>Timeframes</h3><table><tr><td>TF</td><td>State</td><td class=n>Chg</td><td class=n>RSI14</td><td class=n>vs EMA21</td><td class=n>vs EMA55</td></tr>${x.tf.map(t=>t?`<tr><td>${t.tf}</td><td style="color:${t.st=='Up'?'#4cd17a':t.st=='Down'?'#ff6b6b':'#e8c46b'}">${t.st}</td><td class=n>${t.chg!=null?pc(t.chg):'–'}</td><td class=n>${t.rsi??'–'}</td><td class=n>${t.vs21!=null?t.vs21+'%':'–'}</td><td class=n>${t.vs55!=null?t.vs55+'%':'–'}</td></tr>`:'').join('')}</table><small>1H/4H: ${m.kind=='crypto'?'Coinbase hourly candles':'Yahoo 60-minute bars'}; W/M built from daily. ${x.tf.filter(t=>t&&t.note).map(t=>t.tf+': '+t.note).join('; ')}</small></div>
 <div class="card"><h3>Trapped money</h3>${x.vp?`1y volume traded above price (holders at a loss): <b>${x.vp.in_loss}%</b>; below (in profit): ${x.vp.in_profit}%. Point of control ${fm(x.vp.poc)}.<table>${x.vp.bands.map(b=>row(`${fm(b.lo)}–${fm(b.hi)} <small>${b.side=='above'?'overhead supply':b.side=='below'?'support':'at price'}</small>`,b.pct+'%')).join('')}</table>`:''}${x.conf_b.length?`<div>Fib inside volume band: ${x.conf_b.map(z=>`${z[0]} @ ${fm(z[1])}`).join(', ')}</div>`:''}${x.der?`<div style="margin-top:6px"><b>Derivatives</b> <small>(${x.der.src}, ${x.der.asof})</small><table>${row('Funding now / 7d avg (per 8h)',(x.der.fund_now??'–')+'% / '+(x.der.fund_7d??'–')+'%')+row('Open interest',us(x.der.oi_usd)+` (7d ${x.der.oi_7d??'–'}%, 30d ${x.der.oi_30d??'–'}%)`)+row('Long/short account ratio',x.der.ls??'N/A')+row('Shorts opened below price (underwater, est.)',us(x.der.short_underwater))+row('Longs opened above price (underwater, est.)',us(x.der.long_underwater))+row('Est. short liquidation clusters above',(x.der.liq_short_above||[]).map(z=>fm(z[0])+' ('+us(z[1])+')').join(', ')||'–')+row('Est. long liquidation clusters below',(x.der.liq_long_below||[]).map(z=>fm(z[0])+' ('+us(z[1])+')').join(', ')||'–')}</table><small>Liquidation clusters are estimated from daily OI additions at 10x/25x/50x; not exchange liquidation maps.</small></div>`:`<div><small>Derivatives: N/A (no OKX USDT perpetual${m.kind=='equity'?'; equity':''}).</small></div>`}<small> Exchange netflows and token unlocks: N/A (no free keyless source on this box).</small></div>
 <div class="card"><h3>Who holds it</h3><table>${x.hold.rows.map(r=>row(r[0]+`<br><small style="color:#7d8aa3">${r[2]}</small>`,r[1]==='N/A'?'N/A':r[1]+'%')).join('')}</table>${x.hold.trend.length?'<div><b>Cohort trend</b><br>'+x.hold.trend.map(t=>`${t[0]}: <b>${t[1]}</b> <small>${t[2]}</small>`).join('<br>')+'</div>':''}${x.der?`<div>Perp traders: ${(x.der.oi_7d||0)>0?'<b>adding</b>':'<b>reducing</b>'} positions (OI 7d ${x.der.oi_7d??'–'}%)</div>`:''}${x.hold.top?'<div><small>Largest: '+x.hold.top.map(t=>t[0]+' '+t[1]+(m.kind=='crypto'?'%':'')).join(' · ')+'</small></div>':''}</div>
 <div class="card"><h3>Wyckoff (algorithmic read, ${x.wy.conf}% confidence)</h3><b>${x.wy.phase}</b>${x.wy.hi?` · range ${fm(x.wy.lo)}–${fm(x.wy.hi)} since ${x.wy.start}`:''}<br><small>${(x.wy.events||[]).map(e=>e[0]+' '+e[1]+' @ '+fm(e[2])).join(' · ')}</small></div>
 <div class="card"><h3>Elliott wave (algorithmic read, ${x.el.conf}% confidence)</h3>${x.el.read}${x.el.w2?'<br><b style="color:#4cd17a">Wave-2 retrace into .618-.786 holding: wave-3 setup</b>':''}<br><small>Swing pivots: ${(x.el.pivots||[]).slice(-5).map(p=>p[2]+' '+fm(p[1])+' '+p[0]).join(' → ')}</small></div>`:'';
 document.getElementById('notes').innerHTML=XC+`<div class="card"><h3>State</h3><b>${n.st}</b> (${n.ext>0?'+':''}${n.ext}% vs EMA21)<table>${row('Price',fm(n.px))+row('MTD',pc(n.mtd))+row('30d',pc(n.d30))+row('3M',pc(n.m3))+row('YTD',pc(n.ytd))+row('From 52w low',pc(n.low52))+row('From 52w high',pc(n.hi52d))+row('From ATH',n.athd==null?'– <small>(not available)</small>':pc(n.athd)+` <small>${fm(n.ath)} ${n.ath_date}</small>`)+row('Invalidation',fm(n.call?n.call.stop:n.inval))}</table></div>
 <div class="card"><h3>Setup</h3>${n.call?`<b>${n.call.setup}</b> · ${n.call.dir}<br>Entry ${fm(n.call.entry_lo)}–${fm(n.call.entry_hi)} · target ${fm(n.call.target)} · invalidation ${fm(n.call.stop)} · horizon ${n.call.horizon}<br><small>Logged to the <a href="calls.html">call ledger</a>.</small>`:(n.setups.length?n.setups.join(', '):'No named setup active.')}</div>
 <div class="card"><h3>Macro fit</h3><b>${n.fit}</b>. ${n.fitwhy}</div><div class="card"><h3>What to learn here</h3>${n.learn}</div>
 <div class="card"><h3>Influencers & gut calls</h3>${inf.length?inf.map(c=>`<div style="margin-bottom:6px"><b>${c.who}</b> ${c.date} · ${c.dir}${c.target?' → '+fm(c.target):''}${c.stop?' · stop '+fm(c.stop):''}<br><small>"${c.quote}" ${c.url?`<a href="${c.url}" target="_blank">post</a>`:''} · ${c.score.status} ${c.score.ret!=null?(c.score.ret>0?'+':'')+c.score.ret+'%':''}</small></div>`).join(''):'<small>No linked public calls with a level on this asset found (BCB, Krown, Cam Fous, Raoul Pal; X, last 60 days).</small>'}</div>
 ${mine.length?`<div class="card"><h3>Terminal call history</h3>${mine.map(c=>`${c.date} ${c.dir} ${c.setup}: ${c.score.status} ${c.score.ret>0?'+':''}${c.score.ret}%`).join('<br>')}</div>`:''}`;
}).catch(e=>{document.getElementById('ti').textContent=s+': no chart data'});
</script><script src="../nav.js" defer></script></body></html>
