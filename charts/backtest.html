<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-breakout score: backtest</title>
<style>body{margin:0;background:#0b0f17;color:#e8ecf3;font:14px system-ui}main{max-width:1100px;margin:auto;padding:14px}a{color:#7fd1ff}table{border-collapse:collapse;margin:8px 0 18px}td,th{border-bottom:1px solid #263248;padding:5px 9px;text-align:right}th{color:#9fb0cc;font-size:12px}td:first-child,th:first-child{text-align:left}.m{color:#9fb0cc}</style></head>
<body><main><a href="./">← Chart book</a><h1>Pre-breakout score and Wyckoff spring: forward returns</h1><p class="m" id="note"></p><div id="o"></div></main>
<script>
const r=(x)=>x?`<td>${x.n}</td><td>${x.pup}%</td><td>${x.med}%</td><td>${x.avg}%</td><td>${x.p25}% / ${x.p75}%</td>`:'<td colspan=5>no sample</td>';
const H='<tr><th>Group</th><th>n</th><th>% up</th><th>Median</th><th>Mean</th><th>25th / 75th pct</th></tr>';
fetch('backtest.json').then(x=>x.json()).then(B=>{document.getElementById('note').textContent=B.note+' As of '+B.asof+'.';let h='';
for(const k of ['crypto','equity','all']){for(const hz of ['f30','f45']){h+=`<h3>${k} · ${hz=='f30'?'30':'45'}-day forward</h3><table>${H}<tr><td><b>All sampled days (baseline)</b></td>${r(B.all[k][hz])}</tr>`;
 B.buckets.filter(b=>b.kind==k).forEach(b=>h+=`<tr><td>Score ${b.lo}-${b.hi==101?100:b.hi-1}</td>${r(b[hz])}</tr>`);
 h+=`<tr><td>Wyckoff spring in the last 5 bars</td>${r(B.spring[k][hz])}</tr></table>`}}
document.getElementById('o').innerHTML=h});
</script><script src="../nav.js" defer></script></body></html>
