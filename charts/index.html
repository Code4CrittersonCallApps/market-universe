<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart book: Uphold · Coinbase · Schwab IRA</title>
<style>body{margin:0;background:#0b0f17;color:#e8ecf3;font:13px system-ui}main{max-width:1400px;margin:auto;padding:12px}a{color:#7fd1ff}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #263248;padding:5px 6px;text-align:left;white-space:nowrap}th{color:#9fb0cc;font-size:11px;cursor:pointer;position:sticky;top:30px;background:#0b0f17}tr.r{cursor:pointer}tr.r:hover{background:#151c2a}
.n{text-align:right;font-variant-numeric:tabular-nums}.t{font-size:10px;padding:1px 5px;border-radius:5px;margin-right:2px;background:#263248}.UH{background:#2c4a7a}.CB{background:#1b4fd8}.Schwab{background:#0b6b5a}
input,select{background:#151c2a;color:#e8ecf3;border:1px solid #263248;border-radius:6px;padding:6px}.g{color:#4cd17a}.r_{color:#ff6b6b}</style></head>
<body><main><h1>Chart book</h1><p id="cnt"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input id="q" placeholder="Search symbol or name" size="26">
<label><input type="checkbox" class="pf" value="UH" checked> Uphold</label><label><input type="checkbox" class="pf" value="CB" checked> Coinbase</label><label><input type="checkbox" class="pf" value="Schwab" checked> Schwab IRA</label>
<select id="st"><option value="">All trend states</option><option>UPTREND · EXTENDED</option><option>UPTREND · PULLBACK</option><option>TRANSITION</option><option>DOWNTREND</option></select>
<select id="fit"><option value="">Any macro fit</option><option>aligned</option><option>neutral</option><option>contradicts</option></select>
<label><input type="checkbox" id="calls"> Active setup only</label> <a href="calls.html"><b>Call ledger →</b></a></div>
<table id="tb"></table></main><script>
const C=[['s','Symbol'],['name','Name'],['p','Buy on'],['grp','Group'],['px','Price'],['mtd','MTD %'],['d30','30d %'],['m3','3M %'],['ytd','YTD %'],['low52','From 52w low %'],['hi52d','From 52w high %'],['athd','From ATH %'],['st','Trend'],['setup','Setup'],['fit','Macro fit']];
let D=[],sk='mtd',sd=-1;const num=k=>['px','mtd','d30','m3','ytd','low52','hi52d','athd'].includes(k);
const f=(k,v)=>v==null||v===''?'–':k=='px'?(+v).toPrecision(5):num(k)?`<span class="${v>=0?'g':'r_'}">${v>0?'+':''}${v}</span>`:k=='p'?v.map(x=>`<span class="t ${x}">${x}</span>`).join(''):v;
function rows(){const q=document.getElementById('q').value.toLowerCase(),pf=[...document.querySelectorAll('.pf:checked')].map(x=>x.value),st=document.getElementById('st').value,fi=document.getElementById('fit').value,ca=document.getElementById('calls').checked;
 let r=D.filter(x=>(!q||(x.s+' '+x.name).toLowerCase().includes(q))&&x.p.some(p=>pf.includes(p))&&(!st||x.st==st)&&(!fi||x.fit==fi)&&(!ca||x.call));
 r.sort((a,b)=>{let x=a[sk],y=b[sk];if(Array.isArray(x)){x=x.join();y=y.join()}if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*sd});
 sessionStorage.setItem('cbook',JSON.stringify(r.map(x=>x.s)));document.getElementById('cnt').textContent=r.length+' of '+D.length+' assets shown. Click a column to sort, a row to open the chart.';
 document.getElementById('tb').innerHTML='<tr>'+C.map(([k,l])=>`<th class="${num(k)?'n':''}" onclick="srt('${k}')">${l}${k==sk?(sd>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+r.map(x=>`<tr class="r" onclick="location='chart.html?s=${encodeURIComponent(x.s)}'">`+C.map(([k])=>`<td class="${num(k)?'n':''}">${f(k,x[k])}</td>`).join('')+'</tr>').join('')}
function srt(k){sd=k==sk?-sd:(num(k)?-1:1);sk=k;rows()}
document.querySelectorAll('input,select').forEach(e=>e.oninput=rows);
fetch('index.json').then(r=>r.json()).then(d=>{D=d;const u=d.filter(x=>x.p.includes('UH')).length,c=d.filter(x=>x.p.includes('CB')).length,s=d.filter(x=>x.p.includes('Schwab')).length;document.querySelector('h1').textContent=`Chart book: ${d.length} assets · Uphold ${u} · Coinbase ${c} · Schwab IRA ${s}`;rows()});
</script><script src="../nav.js" defer></script></body></html>
